# Application Configuration
app.base.url=http://localhost:8080/ui
app.name=QA Training Application

# Browser Configuration
browser.type=chromium
browser.headless=false
browser.timeout=30000
browser.viewport.width=1920
browser.viewport.height=1080

# API Configuration
api.base.url=http://localhost:8080/api
api.timeout=10000

# Test Data Configuration
test.data.path=src/test/resources/testdata

# Screenshot Configuration
screenshot.on.failure=true
screenshot.path=target/screenshots

# Reporting Configuration
report.path=target/allure-results
report.screenshot.enabled=true

# Logging Configuration
log.level=INFO
log.path=target/logs

# Test User Credentials (Change these based on your application)
test.user.admin.username=admin
test.user.admin.password=admin123
test.user.user.username=testuser
test.user.user.password=test123

# Retry Configuration
retry.max.attempts=2
retry.enabled=false

# Parallel Execution
parallel.execution.enabled=false
parallel.thread.count=4
